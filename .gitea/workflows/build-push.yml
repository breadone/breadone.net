name: Build and push web image

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: git.bread.one
  IMAGE_NAME: breadone/breadonedotnet

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ gitea.ref_name }}
          build-args: |
            PUBLIC_PB_URL=${{ secrets.PUBLIC_PB_URL }}
            PB_EMAIL=${{ secrets.PB_EMAIL }}
            PB_PW=${{ secrets.PB_PW }}
